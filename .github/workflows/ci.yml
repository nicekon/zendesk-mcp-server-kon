name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q

      - name: Build the project
        run: uv build

      - name: Install and handshake the wheel
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python - <<'PY'
          import asyncio
          import sys
          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def main():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-c", "from zendesk_mcp_server import main; main()"],
                  env={},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      assert (await session.initialize()).serverInfo.name == "Zendesk"
                      assert len((await session.list_tools()).tools) == 101

          asyncio.run(main())
          PY

  package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python }}
      - run: uv build
      - name: Install and handshake the wheel
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python - <<'PY'
          import asyncio
          import sys
          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def main():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-c", "from zendesk_mcp_server import main; main()"],
                  env={},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      assert (await session.initialize()).serverInfo.name == "Zendesk"
                      assert len((await session.list_tools()).tools) == 101

          asyncio.run(main())
          PY
      - name: Install and handshake the wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv venv --python ${{ matrix.python }} .wheel-venv
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          uv pip install --python .wheel-venv\Scripts\python.exe $wheel
          @'
          import asyncio
          import sys
          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def main():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-c", "from zendesk_mcp_server import main; main()"],
                  env={},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      assert (await session.initialize()).serverInfo.name == "Zendesk"
                      assert len((await session.list_tools()).tools) == 101

          asyncio.run(main())
          '@ | & .wheel-venv\Scripts\python.exe
