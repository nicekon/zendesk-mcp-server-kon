name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q
      - run: uv build
      - name: Install and handshake the wheel
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python - <<'PY'
          import asyncio
          import sys
          from mcp.client.session import ClientSession
          from mcp.client.stdio import StdioServerParameters, stdio_client

          async def main():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["-c", "from zendesk_mcp_server import main; main()"],
                  env={},
              )
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      assert (await session.initialize()).serverInfo.name == "Zendesk"
                      assert len((await session.list_tools()).tools) == 101

          asyncio.run(main())
          PY

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
